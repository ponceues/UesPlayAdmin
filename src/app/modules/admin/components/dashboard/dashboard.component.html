<div class="grid" *ngIf="!loading && summaryList.length > 0">
    <div class="col-12 md:col-6 lg:col-4" *ngFor="let summary of summaryList">
        <div class="bg-white border-1 border-round p-3">
            <div class="flex justify-content-between align-items-start">
                <div class="text-900 font-medium text-xl">{{ summary.entity }}</div>
                <div class="surface-100 border-round p-2">
                    <lucide-icon [name]="summary.icon" [class]="summary.color + ' text-2xl'"></lucide-icon>
                </div>
            </div>
            <div class="text-900 font-bold text-4xl">{{ summary.total }}</div>
            <div class="font-medium my-2">
                <span [class]="summary.color  + ' font-semibold'">{{ summary.active }} activos</span>
            </div>
        </div>
    </div>
</div>

<div *ngIf="loading" class="flex justify-content-center align-items-center p-5">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
</div>

<div *ngIf="!loading && summaryList.length === 0" class="surface-card shadow-2 border-round p-5 text-center">
    <i class="pi pi-info-circle text-4xl text-500 mb-3"></i>
    <p class="text-700 text-xl">No hay datos disponibles. Verifica tus permisos.</p>
</div>
