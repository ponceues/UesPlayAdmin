<div style="max-width: 100%; overflow-x: auto;"
     class="grid bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen overflow-hidden">
    <div class="sm:col-11 md:col-8 lg:col-6 xl:col-4">
        <app-configurator />
        <div class="w-full bg-surface-0 dark:bg-surface-900 py-5 px-4 sm:px-20 shadow-1" style="border-radius: 12px">
            <div class="grid">
                <div class="col-12 flex justify-content-center">
                    <img src="svg/minerva.svg" height="350">
                </div>
                <div class="col-12 flex justify-content-center">
                    <h2>Restablecer contraseña</h2>
                </div>
            </div>
            <form [formGroup]="recoveryForm" class="grid formgrid">
                <div class="col-12 field mb-4">
                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
                        Nueva Contraseña
                    </label>
                    <p-password [toggleMask]="true"
                                [fluid]="true"
                                [feedback]="true"
                                id="password"
                                formControlName="password"
                                placeholder="Ingresa tu nueva contraseña">
                    </p-password>
                    <div *ngIf="recoveryForm.get('password')?.invalid && (recoveryForm.get('password')?.dirty || recoveryForm.get('password')?.touched)">
                        <p-message *ngIf="recoveryForm.hasError('required','password')"
                                   severity="error"
                                   variant="simple"
                                   size="small">La contraseña es requerida</p-message>
                        <p-message *ngIf="recoveryForm.hasError('minlength','password')"
                                   severity="error"
                                   variant="simple"
                                   size="small">La contraseña debe tener al menos 6 caracteres</p-message>
                    </div>
                </div>

                <div class="col-12 field mb-4">
                    <label for="verify_password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
                        Confirmar Contraseña
                    </label>
                    <p-password [toggleMask]="true"
                                [fluid]="true"
                                [feedback]="false"
                                id="password_confirmation"
                                formControlName="password_confirmation"
                                placeholder="Confirma tu nueva contraseña">
                    </p-password>
                    <div *ngIf="recoveryForm.get('password_confirmation')?.invalid && (recoveryForm.get('password_confirmation')?.dirty || recoveryForm.get('password_confirmation')?.touched)">
                        <p-message *ngIf="recoveryForm.hasError('required','password_confirmation')"
                                   severity="error"
                                   variant="simple"
                                   size="small">Debes confirmar la contraseña</p-message>
                    </div>
                    <div *ngIf="recoveryForm.hasError('passwordMismatch') && recoveryForm.get('password_confirmation')?.dirty">
                        <p-message severity="error"
                                   variant="simple"
                                   size="small">Las contraseñas no coinciden</p-message>
                    </div>
                </div>
            </form>

            <div class="grid">
                <div class="col-12 mt-2" *ngIf="showErrorMessage">
                    <p-message severity="error" styleClass="error-message-centered">
                        {{ errorMessage }}
                    </p-message>
                </div>
                <div class="col-12 mt-2" *ngIf="showSuccessMessage">
                    <p-message severity="success" styleClass="error-message-centered">
                        {{ successMessage }}
                    </p-message>
                </div>
                <div class="col-12 my-2">
                    <p-button (onClick)="resetPasswordFn()"
                              [disabled]="httpLoading || recoveryForm.invalid"
                              [label]="httpLoading ? '' : 'Restablecer Contraseña'"
                              [loading]="httpLoading"
                              styleClass="w-full"></p-button>
                </div>
                <div class="col-12">
                    <p-button   severity="secondary"
                                styleClass="w-full"
                                (onClick)="goToLogin()"
                                label="Ir a login" >
                    </p-button>
                </div>
            </div>
        </div>
    </div>
</div>
