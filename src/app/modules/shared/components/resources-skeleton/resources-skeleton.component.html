<div class="w-full">
    <div class="grid">
        <div class="col-12 flex">
            <p-skeleton class="mt-3 mb-3 ml-2" height="2.5rem"  width="9rem" borderRadius="16px" ></p-skeleton>
            <p-skeleton class="mt-3 mb-3 ml-2" height="2.5rem"  width="9rem" borderRadius="16px" ></p-skeleton>
            <p-skeleton class="mt-3 mb-3 ml-2" height="2.5rem"  width="9rem" borderRadius="16px" ></p-skeleton>
            <p-skeleton class="mt-3 mb-3 ml-2" height="2.5rem"  width="9rem" borderRadius="16px" ></p-skeleton>
        </div>

        <div class="col-6 flex">
            <p-skeleton class="w-full mt-3 mb-3" height="2.5rem" ></p-skeleton>
        </div>
    </div>

    <div class="grid">
        <div *ngFor="let i of [].constructor(count);" class="col-12 md:col-4 lg:col-3 xl:col-3">
            <div class="card w-full">
                <div class="grid">
                    <div class="col-12">
                        <p-skeleton height="10rem" />
                    </div>
                    <div class="col-fixed" style="width: 75px" >
                        <p-skeleton shape="circle" size="4rem"/>
                    </div>
                    <div class="col">
                        <p-skeleton height="1.5rem" class="w-full" styleClass="mb-2"/>
                        <p-skeleton height="1.5rem" width="5rem" class="mt-3" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
