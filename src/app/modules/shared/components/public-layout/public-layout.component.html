<app-configurator />
<div class="layout-wrapper" *ngIf="!loadingPage" >
    <div class="layout-topbar">
        <div class="layout-topbar-logo-container">
            <a class="layout-topbar-logo" routerLink="/">
                <svg fill="#8b0e13" width="56px" height="56px" viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="SVGRepo_iconCarrier">
                        <path d="m22.018 13.298-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065 3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/>
                    </g>
                </svg>
                <span class="up-nav-label">UESPLAY</span>
            </a>
        </div>
        <div class="layout-topbar-menu upl-layout-topbar-menu">
            <div class="layout-topbar-menu-content">
                <div class="app-layout-topbar-menu-item"
                     *ngFor="let item of resourceTypes">
                   <span    [ngClass]="{'active':item.typeId === selectedResourceType!.typeId}"
                            (click)="navigateToUrl(item)">
                            {{item.name}}
                   </span>
                </div>
            </div>
        </div>

        <div class="layout-topbar-actions">
            <div class="layout-topbar-menu hidden lg:block">
                <div class="layout-topbar-menu-content">
                    <button (click)="goToLogin()"
                            type="button"
                            class="layout-topbar-action">
                        <lucide-icon name="log-in"></lucide-icon>
                        <span>Iniciar sesion</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="up-layout-main-container">
        <div class="up-layout-main mb-5" style="overflow-x:hidden; ">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<div    *ngIf="loadingPage"
        class="flex justify-center align-content-center"
        style="padding-top: 20rem">
    <i class="pi pi-spin pi-spinner"></i>
</div>
